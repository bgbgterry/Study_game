    // ====== 畫面 2：開始關卡測驗 ======
    function startLevel(levelNum) {
      const levelObj = window.SCIENCE_GAME_DATA.levels.find(l => l.level === levelNum);
      if (!levelObj) return;
      const t = getTheme();
      document.body.classList.add('in-quiz');

      // 確保每輪 10 題中一定包含「勾選題（多重選項複選題）」與「單選題」，並套用自適應加權抽樣
      const multiPool = levelObj.questions.filter(q => q.isMulti && Array.isArray(q.answers));
      const singlePool = levelObj.questions.filter(q => !q.isMulti);
      let selectedPool = [];
      if (multiPool.length > 0 && singlePool.length > 0) {
        const targetMulti = Math.min(multiPool.length, levelNum >= 6 ? 4 : 3);
        const targetSingle = QUESTIONS_PER_ROUND - targetMulti;
        const pickedMulti = selectAdaptiveQuestions(multiPool, targetMulti);
        const pickedSingle = selectAdaptiveQuestions(singlePool, targetSingle);
        selectedPool = shuffleArray([...pickedMulti, ...pickedSingle]);
      } else {
        selectedPool = selectAdaptiveQuestions(levelObj.questions, QUESTIONS_PER_ROUND);
      }

      const preparedQuestions = selectedPool.map(q => ({
        ...q,
        selectedIndices: [],
        shuffledOptions: shuffleArray(q.options)
      }));

      currentSession = {
        level: levelNum,
        levelObj,
        questions: preparedQuestions,
        currentIndex: 0,
        correctCount: 0,
        wrongRecords: [],
        answered: false
      };

      setMascot(
        t.mascotAvatar,
        `挑戰者 <b>${progress.playerName}</b>，現在進入 <b>${levelObj.name}</b>！已隨機抽出 <b>10 道題目（含☑️多重勾選題）</b>，只要答對 <b>${PASS_SCORE} 題以上（80分）</b> 就能過關晉級喔！${t.hintIcon}`
      );
      renderQuestionScreen();
      const stage = document.getElementById('main-stage');
      if (stage) stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function getPassStatusText(s) {
      const totalQ = s.questions.length;
      const maxMistakes = totalQ - PASS_SCORE; // 2
      if (s.correctCount >= PASS_SCORE) {
        return '已達標過關！🎉';
      }
      if (s.wrongRecords.length <= maxMistakes) {
        return `目標${PASS_SCORE}題 (還可錯 ${maxMistakes - s.wrongRecords.length} 題)`;
      }
      return '未達8題 (可點強制過關)';
    }

    function renderQuestionScreen() {
      const stage = document.getElementById('main-stage');
      const s = currentSession;
      const t = getTheme();
      const q = s.questions[s.currentIndex];
      const card = getCardById(q.cardId);
      const qNum = s.currentIndex + 1;
      const totalQ = s.questions.length;
      const progressPct = Math.round((qNum / totalQ) * 100);
      const levelThemeIcon = t.levelIcons[s.level - 1] || s.levelObj.icon;
      const isMulti = Boolean(q.isMulti && Array.isArray(q.answers));
      if (!Array.isArray(q.selectedIndices)) q.selectedIndices = [];

      const optionLabels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      const optionsHtml = q.shuffledOptions.map((opt, idx) => {
        if (isMulti) {
          const isSel = q.selectedIndices.includes(idx);
          return `
            <button class="option-btn ${isSel ? 'selected' : ''}" id="opt-btn-${idx}" onclick="toggleMultiOption(${idx})">
              <span class="option-checkbox" id="opt-chk-${idx}">${isSel ? '☑️' : '⬜'}</span>
              <span class="option-index">${optionLabels[idx] || (idx + 1)}</span>
              <span>${opt}</span>
            </button>
          `;
        }
        return `
          <button class="option-btn" id="opt-btn-${idx}" onclick="submitAnswer(${idx})">
            <span class="option-index">${optionLabels[idx] || (idx + 1)}</span>
            <span>${opt}</span>
          </button>
        `;
      }).join('');

      const multiBannerHtml = isMulti ? `
        <div class="multi-question-banner">
          <span>☑️ 【勾選題・多重選項】請點擊勾選所有正確的選項（可複選），完成後按下方「確認送出勾選答案」！</span>
        </div>
      ` : '';

      const multiSubmitHtml = isMulti ? `
        <div class="multi-submit-bar" id="multi-submit-bar">
          <button class="kawaii-btn btn-primary" id="multi-submit-btn" onclick="submitMultiAnswer()" style="font-size:1.12rem; padding:12px 32px;">
            ✅ 確認送出勾選答案（已勾選 <span id="multi-selected-count">${q.selectedIndices.length}</span> 項）
          </button>
        </div>
      ` : '';

      stage.innerHTML = `
        <div class="quiz-topbar">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <button class="kawaii-btn btn-reset" onclick="showMapScreen()">⬅ 返回地圖</button>
            <div class="quiz-level-tag">${levelThemeIcon} ${s.levelObj.name}</div>
            <button class="kawaii-btn btn-butter" style="padding: 6px 13px; font-size: 0.86rem;" onclick="forcePassCurrentLevel()">⚡ 強制過關</button>
          </div>
          <div class="scoreboard">
            <div class="score-pill">${t.playerIcon} 挑戰者：${progress.playerName}</div>
            <div class="score-pill" id="pill-status">${t.scoreStatusIcon} 狀態：${getPassStatusText(s)}</div>
            <div class="score-pill" id="pill-score">${t.scorePointIcon} 答對：${s.correctCount} / ${totalQ}</div>
          </div>
        </div>

        <div class="progress-section">
          <div class="progress-info">
            <span>${t.progressIcon} 當前關卡進度：第 ${qNum} / ${totalQ} 題（答對 ${PASS_SCORE} 題即可過關）</span>
            <span>${progressPct}%</span>
          </div>
          <div class="quiz-progress-track">
            <div class="quiz-progress-bar" style="width: ${progressPct}%;"></div>
          </div>
        </div>

        <div class="question-box">
          <div class="question-meta">
            <span class="lesson-badge">🔬 單元範圍：${card.activityTitle}（${card.tag}）</span>
            <button class="hint-btn" onclick="toggleHint()">${t.hintIcon} 科學提示</button>
          </div>
          ${multiBannerHtml}
          <div class="question-text">${q.prompt}</div>
          <div class="hint-popup" id="hint-box">💡 提示：${q.hint}</div>
        </div>

        <div class="options-grid" id="options-grid">
          ${optionsHtml}
        </div>

        ${multiSubmitHtml}

        <div class="feedback-panel" id="feedback-panel"></div>
      `;
    }

    function toggleHint() {
      const box = document.getElementById('hint-box');
      if (box) {
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
      }
    }

    // 切換勾選題（複選）選項狀態
    function toggleMultiOption(idx) {
      const s = currentSession;
      if (!s || s.answered) return;
      const q = s.questions[s.currentIndex];
      if (!Array.isArray(q.selectedIndices)) q.selectedIndices = [];

      const pos = q.selectedIndices.indexOf(idx);
      if (pos >= 0) {
        q.selectedIndices.splice(pos, 1);
      } else {
        q.selectedIndices.push(idx);
      }

      const isSel = q.selectedIndices.includes(idx);
      const btn = document.getElementById(`opt-btn-${idx}`);
      const chk = document.getElementById(`opt-chk-${idx}`);
      if (btn) btn.classList.toggle('selected', isSel);
      if (chk) chk.textContent = isSel ? '☑️' : '⬜';

      const countEl = document.getElementById('multi-selected-count');
      if (countEl) countEl.textContent = q.selectedIndices.length;
    }

    // 送出勾選題（多重選項複選題）答案
    function submitMultiAnswer() {
      const s = currentSession;
      if (!s || s.answered) return;
      const t = getTheme();
      const q = s.questions[s.currentIndex];
      if (!q.selectedIndices || q.selectedIndices.length === 0) {
        playWrongSound();
        setMascot(t.mascotCheer, `提醒 <b>${progress.playerName}</b>：這題是<b>☑️ 勾選題（複選題）</b>，請先點擊勾選你認為正確的選項，再按「確認送出勾選答案」喔！`);
        return;
      }

      s.answered = true;
      const submitBar = document.getElementById('multi-submit-bar');
      if (submitBar) submitBar.style.display = 'none';

      const optGrid = document.getElementById('options-grid');
      if (optGrid) optGrid.classList.add('answered-compact');

      const sortedIndices = [...q.selectedIndices].sort((a, b) => a - b);
      const chosenOptions = sortedIndices.map(i => q.shuffledOptions[i]);
      const correctSet = new Set(q.answers || []);
      const isCorrect = chosenOptions.length === correctSet.size && chosenOptions.every(opt => correctSet.has(opt));
      const card = getCardById(q.cardId);

      q.shuffledOptions.forEach((opt, idx) => {
        const btn = document.getElementById(`opt-btn-${idx}`);
        const chk = document.getElementById(`opt-chk-${idx}`);
        if (!btn) return;
        btn.disabled = true;
        btn.classList.remove('selected');
        const wasPicked = q.selectedIndices.includes(idx);
        const isAns = correctSet.has(opt);

        if (isAns && wasPicked) {
          btn.classList.add('correct');
          if (chk) chk.textContent = '✅';
        } else if (isAns && !wasPicked) {
          btn.classList.add('missed');
          if (chk) chk.textContent = '💡';
        } else if (!isAns && wasPicked) {
          btn.classList.add('wrong');
          if (chk) chk.textContent = '❌';
        }
      });

      const chosenAnswerStr = chosenOptions.join('、');
      const correctAnswerStr = (q.answers || []).join('、') || q.answer;

      if (isCorrect) {
        s.correctCount++;
        playCorrectSound();
        recordQuestionCorrect(q);
        if (s.isMistakeQuiz) {
          resolveMistake(q.prompt);
        }
        setMascot(t.mascotHappy, `太厲害了 <b>${progress.playerName}</b>！這道☑️勾選複選題全數勾選正確！${s.isMistakeQuiz ? '已成功克服一題弱點！' : ''}${t.scorePointIcon}「<b>${card.title}</b>」完全難不倒你！`);
      } else {
        recordQuestionWrong(q);
        recordMistake(q, chosenAnswerStr, card);
        s.wrongRecords.push({
          question: q.prompt,
          yourAnswer: chosenAnswerStr,
          correctAnswer: correctAnswerStr,
          card
        });
        playWrongSound();
        setMascot(t.mascotCheer, `差一點點 <b>${progress.playerName}</b>！這道☑️勾選題的完整正確選項是「<b>${correctAnswerStr}</b>」（黃色虛線代表漏選的正解），已收錄至錯題筆記本供你隨時複習！💪`);
      }

      renderFeedbackPanel(s, q, card, isCorrect, correctAnswerStr);
    }

    function submitAnswer(selectedIndex) {
      const s = currentSession;
      if (!s || s.answered) return;
      s.answered = true;

      const t = getTheme();
      const q = s.questions[s.currentIndex];
      const chosenOption = q.shuffledOptions[selectedIndex];
      const isCorrect = chosenOption === q.answer;
      const card = getCardById(q.cardId);

      // 緊湊化選項高度，讓下方答案與解析小卡直接進入視野中央
      const optGrid = document.getElementById('options-grid');
      if (optGrid) optGrid.classList.add('answered-compact');

      q.shuffledOptions.forEach((opt, idx) => {
        const btn = document.getElementById(`opt-btn-${idx}`);
        btn.disabled = true;
        if (opt === q.answer) {
          btn.classList.add('correct');
        } else if (idx === selectedIndex && !isCorrect) {
          btn.classList.add('wrong');
        }
      });

      if (isCorrect) {
        s.correctCount++;
        playCorrectSound();
        recordQuestionCorrect(q);
        if (s.isMistakeQuiz) {
          resolveMistake(q.prompt);
        }
        setMascot(t.mascotHappy, `太棒了 <b>${progress.playerName}</b>！答對囉！${s.isMistakeQuiz ? '已成功克服一題弱點！' : ''}${t.scorePointIcon}「<b>${card.title}</b>」掌握得超棒！${t.scoreStatusIcon}`);
      } else {
        recordQuestionWrong(q);
        recordMistake(q, chosenOption, card);
        s.wrongRecords.push({
          question: q.prompt,
          yourAnswer: chosenOption,
          correctAnswer: q.answer,
          card
        });
        playWrongSound();
        setMascot(t.mascotCheer, `別氣餒 <b>${progress.playerName}</b>！已為你收錄至自然錯題筆記本，正確答案是「<b>${q.answer}</b>」，多看一次解析小卡加深記憶喔！💪`);
      }

      renderFeedbackPanel(s, q, card, isCorrect, q.answer);
    }

    function renderFeedbackPanel(s, q, card, isCorrect, correctAnswerDisplay) {
      const t = getTheme();
      const totalQ = s.questions.length;
      const pillStatus = document.getElementById('pill-status');
      const pillScore = document.getElementById('pill-score');
      if (pillStatus) pillStatus.innerHTML = `${t.scoreStatusIcon} 狀態：${getPassStatusText(s)}`;
      if (pillScore) pillScore.innerHTML = `${t.scorePointIcon} 答對：${s.correctCount} / ${totalQ}`;

      const panel = document.getElementById('feedback-panel');
      panel.className = `feedback-panel ${isCorrect ? 'is-correct' : 'is-wrong'}`;
      panel.style.display = 'block';

      const isLast = s.currentIndex === s.questions.length - 1;

      panel.innerHTML = `
        <div class="feedback-header">
          <div class="feedback-title" style="color: ${isCorrect ? '#16694A' : '#C9385A'};">
            ${isCorrect ? `${t.scorePointIcon} 答對了！科學觀念超正確！` : `💦 答錯囉！正確答案是：「${correctAnswerDisplay}」`}
          </div>
          <button class="kawaii-btn ${isCorrect ? 'btn-accent' : 'btn-primary'}" id="next-q-btn" onclick="nextQuestion()">
            ${isLast ? '🏁 查看闖關結算' : '下一題 ➡'}
          </button>
        </div>

        <div class="science-study-card">
          <div class="science-card-top">
            <span class="science-card-name">${t.scorePointIcon} ${card.title}</span>
            <span class="science-card-tag">${card.tag}</span>
            <span class="science-card-activity">${card.activityTitle}</span>
          </div>
          <div class="science-detail-row">
            <span class="detail-tag tag-meaning">科學原理</span>
            ${card.summary}
          </div>
          <div class="science-detail-row">
            <span class="detail-tag tag-example">實驗觀察</span>
            ${card.experiment}
          </div>
          <div class="science-detail-row" style="margin-bottom:0;">
            <span class="detail-tag tag-syn">必考提醒</span>
            ${card.tip}
          </div>
        </div>
      `;

      // 自動將解答與科學解析小卡平滑置中於畫面，免手動往下滑
      requestAnimationFrame(() => {
        panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }

    function nextQuestion() {
      const s = currentSession;
      if (!s) return;
      if (s.currentIndex < s.questions.length - 1) {
        s.currentIndex++;
        s.answered = false;
        renderQuestionScreen();
        const stage = document.getElementById('main-stage');
        if (stage) {
          stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      } else {
        finishLevel(false);
      }
    }

    // ====== 畫面 3：關卡結算畫面（答對 8 題即可過關，亦支援強制過關） ======
    function finishLevel(isForced = false) {
      document.body.classList.remove('in-quiz');
      const stage = document.getElementById('main-stage');
      const s = currentSession;
      const t = getTheme();
      const total = s.questions.length;
      const totalLevels = window.SCIENCE_GAME_DATA.levels.length;

      if (s.isMistakeQuiz) {
        playFanfareSound();
        startConfetti();
        const currentMistakes = loadMistakes();
        const reviewHtml = s.wrongRecords.length > 0 ? `
          <div class="review-list" style="margin-top: 20px;">
            <h3>📝 本次仍需加強題目（共 ${s.wrongRecords.length} 題）</h3>
            ${s.wrongRecords.map((item, idx) => `
              <div class="review-item">
                <div class="review-q">${idx + 1}. ${item.question}</div>
                <div class="review-wrong-ans">❌ 你的選擇：${item.yourAnswer}</div>
                <div class="review-ans">⭕ 正確答案：${item.correctAnswer}</div>
                <div style="font-size:0.95rem; color:var(--text-main); font-weight:700; margin-top:6px; background:var(--progress-track-bg); padding:8px 12px; border-radius:10px;">
                  🔬 <b>${item.card.title}（${item.card.activityTitle}）</b>：${item.card.summary}<br>
                  💡 提醒：${item.card.tip}
                </div>
              </div>
            `).join('')}
          </div>
        ` : '';

        setMascot(t.mascotVictory, `太厲害了 <b>${progress.playerName}</b>！錯題強化特訓完成！本次答對 <b>${s.correctCount} / ${total} 題</b>！答對題目已自動降低錯題次數或移出錯題本！${t.scorePointIcon}`);

        stage.innerHTML = `
          <div class="result-box">
            <div class="result-icon">🎯</div>
            <div class="result-title">${t.scorePointIcon} 自然錯題強化特訓完成！ ${t.scorePointIcon}</div>
            <div class="result-subtitle">
              你在本次錯題強化挑戰中答對了 <b>${s.correctCount} / ${total} 題</b>！<br>
              答對的題目已成功克服弱點！目前你的自然錯題本剩餘 <b>${currentMistakes.length}</b> 題。
            </div>
            <div class="score-big-badge">
              <span>🎯 答對率：${Math.round((s.correctCount / total) * 100)}%（答對 ${s.correctCount} / ${total} 題）</span>
            </div>
            <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap;">
              ${currentMistakes.length > 0 ? `
                <button class="kawaii-btn btn-primary" style="font-size:1.12rem; padding:13px 24px;" onclick="stopConfetti(); startMistakeQuiz('all')">
                  🔄 再測一次剩餘錯題 (${currentMistakes.length} 題)
                </button>
              ` : ''}
              <button class="kawaii-btn btn-secondary" onclick="stopConfetti(); openMistakesModal()">
                📖 查閱自然錯題筆記本
              </button>
              <button class="kawaii-btn btn-butter" onclick="stopConfetti(); showMapScreen()">
                ${t.brandIcon} 返回關卡地圖
              </button>
            </div>
            ${reviewHtml}
          </div>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const isPassed = isForced || (s.correctCount >= PASS_SCORE);
      const themeBadge = t.levelBadges[s.level - 1] || s.levelObj.badge;

      const effectiveScore = isForced && s.correctCount < PASS_SCORE ? PASS_SCORE : s.correctCount;
      const prevBest = progress.bestScores[s.level] || 0;
      if (effectiveScore > prevBest) {
        progress.bestScores[s.level] = effectiveScore;
      }

      const reviewHtml = s.wrongRecords.length > 0 ? `
        <div class="review-list" style="margin-top: 20px;">
          <h3>📝 本次錯題科學實驗筆記（共 ${s.wrongRecords.length} 題）</h3>
          ${s.wrongRecords.map((item, idx) => `
            <div class="review-item">
              <div class="review-q">${idx + 1}. ${item.question}</div>
              <div class="review-wrong-ans">❌ 你的選擇：${item.yourAnswer}</div>
              <div class="review-ans">⭕ 正確答案：${item.correctAnswer}</div>
              <div style="font-size:0.95rem; color:var(--text-main); font-weight:700; margin-top:6px; background:var(--progress-track-bg); padding:8px 12px; border-radius:10px;">
                🔬 <b>${item.card.title}（${item.card.activityTitle}）</b>：${item.card.summary}<br>
                💡 提醒：${item.card.tip}
              </div>
            </div>
          `).join('')}
        </div>
      ` : '';

      if (isPassed) {
        playFanfareSound();
        if (!progress.clearedLevels.includes(s.level)) {
          progress.clearedLevels.push(s.level);
        }
        if (s.level < totalLevels && progress.unlockedLevel < s.level + 1) {
          progress.unlockedLevel = s.level + 1;
        }
        saveProgress();

        if (s.level === totalLevels && s.wrongRecords.length === 0) {
          startConfetti();
          setMascot(t.mascotVictory, `太不可思議了 <b>${progress.playerName}</b>！！你把八個等級的自然科學難關全部破解了！快來領取你的【<b>${t.levelBadges[totalLevels - 1]}</b>】專屬榮譽證書吧！🎉`);
          showCertificateScreen();
          return;
        }

        startConfetti();
        const passTypeLabel = isForced ? '⚡ 強制過關成功' : `答對 ${s.correctCount} / ${total} 題（${s.correctCount * 10}分）過關`;
        setMascot(t.mascotHappy, `太強啦！！<b>${progress.playerName}</b> 在 <b>${s.levelObj.name}</b> ${passTypeLabel}！${s.level < totalLevels ? `成功解鎖 <b>Level ${s.level + 1}</b> 囉！` : '已完成全部八個關卡！'}${t.scorePointIcon}`);

        stage.innerHTML = `
          <div class="result-box">
            <div class="result-icon">🏆</div>
            <div class="result-title">${t.progressIcon} 恭喜 ${progress.playerName} 闖關成功！ ${t.progressIcon}</div>
            <div class="result-subtitle">
              你在「${s.levelObj.name}」${isForced ? '使用了「⚡ 強制過關」特權' : `答對了 ${s.correctCount} 道題目（達 ${PASS_SCORE} 題過關標準）`}！<br>
              獲得本關科學榮譽稱號：【<b>${themeBadge}</b>】${t.scorePointIcon} ${s.level < totalLevels ? '並成功解鎖下一關！' : '並解鎖全破榮譽證書！'}
            </div>
            <div class="score-big-badge">
              <span>🎉 成績：${isForced ? `強制過關（答對 ${s.correctCount} / ${total} 題）` : `${s.correctCount * 10} 分（答對 ${s.correctCount} / ${total} 題）`}</span>
            </div>
            <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap;">
              ${s.level < totalLevels ? `
                <button class="kawaii-btn btn-primary" style="font-size:1.15rem; padding:14px 28px;" onclick="stopConfetti(); startLevel(${s.level + 1})">
                  ${t.progressIcon} 立即挑戰 Level ${s.level + 1} ➡
                </button>
              ` : `
                <button class="kawaii-btn btn-primary" style="font-size:1.15rem; padding:14px 28px;" onclick="stopConfetti(); showCertificateScreen()">
                  🏆 領取「${t.levelBadges[totalLevels - 1]}」榮譽證書
                </button>
              `}
              <button class="kawaii-btn btn-butter" onclick="stopConfetti(); showMapScreen()">
                ${t.brandIcon} 返回關卡地圖
              </button>
            </div>
            ${reviewHtml}
          </div>
        `;
      } else {
        saveProgress();
        setMascot(t.mascotCheer, `<b>${progress.playerName}</b> 這次答對了 <b>${s.correctCount} / ${total} 題</b>！只要答對 <b>${PASS_SCORE} 題（80分）</b> 就能過關，你也可以選擇再挑戰一次，或點選「⚡ 直接強制過關」喔！💪`);

        stage.innerHTML = `
          <div class="result-box">
            <div class="result-icon">${t.levelIcons[0]}</div>
            <div class="result-title">${t.scorePointIcon} 差一點點就過關囉！加油！ ${t.scorePointIcon}</div>
            <div class="result-subtitle">
              本關只要「<b>答對 ${PASS_SCORE} 題以上 (80分)</b>」就能過關解鎖下一級喔！<br>
              先看看下方的錯題科學筆記，準備好就重新隨機抽題再挑戰一次，或點選「⚡ 直接強制過關」吧！${t.scoreStatusIcon}
            </div>
            <div class="score-big-badge">
              <span>${t.scorePointIcon} 本次成績：${s.correctCount * 10} 分（答對 ${s.correctCount} / ${total} 題，過關標準 ${PASS_SCORE} 題）</span>
            </div>

            ${reviewHtml}

            <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap;">
              <button class="kawaii-btn btn-primary" style="font-size:1.12rem; padding:13px 24px;" onclick="startLevel(${s.level})">
                🔄 重新隨機抽 10 題・再挑戰一次！
              </button>
              <button class="kawaii-btn btn-accent" style="font-size:1.12rem; padding:13px 24px;" onclick="forcePassCurrentLevel()">
                ⚡ 直接強制過關（解鎖下一關）
              </button>
              <button class="kawaii-btn btn-butter" onclick="showMapScreen()">
                ${t.brandIcon} 返回關卡地圖
              </button>
            </div>
          </div>
        `;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ====== 畫面 4：Level 8 全破榮譽證書 ======
    function showCertificateScreen() {
      currentSession = null;
      document.body.classList.remove('in-quiz');
      startConfetti();
      const stage = document.getElementById('main-stage');
      const t = getTheme();
      const totalLevels = window.SCIENCE_GAME_DATA.levels.length;
      const today = new Date();
      const dateStr = `${today.getFullYear()} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日`;

      const stampsHtml = t.levelBadges.map((b, i) => `
        <div class="cert-stamp">Level ${i + 1} ${b}</div>
      `).join('');

      stage.innerHTML = `
        <div class="certificate-frame">
          <div class="cert-ribbon">${t.scorePointIcon} ${t.brandHeading}・最高榮譽殿堂 ${t.scorePointIcon}</div>
          <div class="cert-title">${t.certTitle}</div>
          <p style="font-weight:700; color:var(--text-soft); font-size:0.95rem;">（可在下方修改挑戰者名字，或點擊右上角切換不同主題風格的證書稱號喔！）</p>

          <div class="cert-name-input-wrap">
            <span style="font-weight:900; font-size:1.2rem;">茲證明挑戰者：</span>
            <input type="text" class="cert-name-input" id="cert-player-name"
                   value="${progress.playerName}"
                   oninput="updatePlayerName(this.value)" />
          </div>

          <div class="cert-body">
            在「國小四年級自然科：第一～二課（地表環境與岩石沙土、水生生物與環境，共 336 題大題庫）」中，<br>
            成功挑戰並通過全數 <b>八大難度關卡（包含☑️多重勾選題型）</b>，<br>
            正式榮獲【<b style="color:var(--primary-deep); font-size:1.25rem;">${t.levelBadges[totalLevels - 1]}</b>】之最高稱號！<br>
            不僅精通岩石風化、土壤保育與水生動植物的奇妙構造，更具備守護地球生態的科學素養，特頒此狀，以資鼓勵！${t.scoreStatusIcon}
          </div>

          <div class="cert-badges-row">
            ${stampsHtml}
          </div>

          <div style="font-weight:900; color:var(--text-soft); margin-bottom:22px;">
            📅 頒發日期：${dateStr}
          </div>

          <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap;">
            <button class="kawaii-btn btn-primary" onclick="window.print()">🖨️ 列印榮譽證書</button>
            <button class="kawaii-btn btn-butter" onclick="stopConfetti(); showMapScreen()">${t.brandIcon} 返回關卡地圖</button>
          </div>
        </div>
      `;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 彩帶特效 (Confetti)
    let confettiAnimId = null;
    function startConfetti() {
      stopConfetti();
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#FFB7C5', '#E2C2FF', '#B5EAD7', '#FFF5BA', '#00A8E8', '#52B788', '#FFD166'];
      const pieces = Array.from({ length: 110 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        w: 8 + Math.random() * 8,
        h: 10 + Math.random() * 10,
        color: colors[Math.floor(Math.random() * colors.length)],
        vy: 2 + Math.random() * 3.5,
        vx: -1.5 + Math.random() * 3,
        angle: Math.random() * Math.PI * 2,
        vAngle: -0.08 + Math.random() * 0.16
      }));

      function frame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.angle += p.vAngle;
          if (p.y > canvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * canvas.width;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        confettiAnimId = requestAnimationFrame(frame);
      }
      frame();
    }

    function stopConfetti() {
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      const canvas = document.getElementById('confetti-canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confetti-canvas');
      if (canvas && confettiAnimId) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });

    // 初始化啟動
    window.addEventListener('DOMContentLoaded', () => {
      applyThemeUI();
      updateMistakesBadge();
      const t = getTheme();
      setMascot(
        t.mascotAvatar,
        `嗨，<b>${progress.playerName}</b>！歡迎來到「<b>水生生物與環境</b>」自然科學闖關實驗室！${t.scorePointIcon}`
      );
      showMapScreen();
      // 若瀏覽器 Cookie 中尚未紀錄挑戰者名字，自動彈出輸入視窗讓玩家輸入並寫入個人 Cookie
      if (!getCookie(COOKIE_NAME_KEY)) {
        openNameModal();
      }
    });
  </script>
